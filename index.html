<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | Directorio Institucional</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Fuente Poppins -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos del administrador -->
    <link rel="stylesheet" href="css/admin.css?v=11">
</head>

<body class="fondo-admin">

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="icono-login">
                <i class="bi bi-person-lock"></i>
            </div>

            <p class="texto-login-superior">
                DIRECTORIO INSTITUCIONAL
            </p>

            <h1 class="titulo-login">
                Acceso al directorio
            </h1>

            <p class="descripcion-login">
                Ingresa con tu correo y contraseña para consultar
                la información institucional.
            </p>

            <form id="formLogin">

                <!-- Correo -->
                <div class="mb-3">

                    <label for="correoLogin" class="form-label">
                        Correo electrónico
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="correoLogin"
                            class="form-control"
                            placeholder="usuario@correo.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

                <!-- Contraseña -->
                <div class="mb-3">

                    <label for="passwordLogin" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-key"></i>
                        </span>

                        <input
                            type="password"
                            id="passwordLogin"
                            class="form-control"
                            placeholder="Escribe tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="btnMostrarPassword"
                            class="btn btn-outline-secondary"
                            title="Mostrar u ocultar contraseña"
                            aria-label="Mostrar u ocultar contraseña"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                </div>

                <!-- Mensajes -->
                <div
                    id="mensajeLogin"
                    class="alert d-none"
                    role="alert"
                ></div>

                <!-- Botón de acceso -->
                <button
                    type="submit"
                    id="btnIniciarSesion"
                    class="btn btn-iniciar-sesion w-100"
                >
                    <i class="bi bi-box-arrow-in-right"></i>

                    <span id="textoBotonLogin">
                        Iniciar sesión
                    </span>
                </button>

            </form>

            <p class="aviso-acceso">
                <i class="bi bi-shield-lock"></i>
                Acceso exclusivo para personal autorizado.
            </p>

        </section>

    </main>

    <!-- El archivo login.js se cargará como módulo
         porque utilizará Firebase -->
    <script type="module" src="js/login.js"></script>

</body>

</html>
